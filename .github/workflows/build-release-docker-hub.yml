name: Deploy to DockerHub

on:
  release:
    types: [published, released]

# Two releases published minutes apart must apply their floating tags in
# publish order; serialize whole runs.
concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  release:
    uses: antst/alkemio-github-workflows/.github/workflows/container-release.yml@v1
    permissions:
      contents: read
    secrets: inherit
