name: Schema Contract

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'docs/**'
      - '.github/workflows/schema-contract.yml'

jobs:
  lint-openapi:
    uses: antst/alkemio-github-workflows/.github/workflows/contract-lint.yml@v1
    permissions:
      contents: read
    with:
      contract-path: contracts/openapi.yaml
