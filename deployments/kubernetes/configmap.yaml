apiVersion: v1
kind: ConfigMap
metadata:
  name: oidc-service-config
  labels:
    app.kubernetes.io/name: oidc-service
    app.kubernetes.io/part-of: alkemio-platform
data:
  OIDC_HYDRA_ADMIN_URL: https://hydra-admin.example
  OIDC_HYDRA_PUBLIC_URL: https://hydra.example
  OIDC_KRATOS_ADMIN_URL: https://kratos-admin.example
  OIDC_SYNAPSE_CALLBACK_URL: https://synapse.example/_synapse/client/oidc/callback
  OIDC_COOKIE_DOMAIN: local.alkem.io
  OIDC_ALLOW_INSECURE_HTTP: "false"
  OIDC_MAINTENANCE_MODE: "false"
  OIDC_MAINTENANCE_RETRY: "0"
  OIDC_READINESS_TIMEOUT: 5s
  OIDC_LOG_LEVEL: info
