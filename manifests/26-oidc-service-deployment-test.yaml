apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: default
  name: oidc-service
  labels:
    app: oidc-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: oidc-service
  template:
    metadata:
      labels:
        app: oidc-service
    spec:
      imagePullSecrets:
        - name: oidc-service-registry
      containers:
        - name: oidc-service
          image: rg.nl-ams.scw.cloud/alkemio/alkemio-oidc-service:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oidc-service-config
            - secretRef:
                name: oidc-service-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
      securityContext:
        fsGroup: 1000
