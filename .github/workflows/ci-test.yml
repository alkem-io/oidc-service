name: CI — Lint & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    uses: antst/alkemio-github-workflows/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
    with:
      sqlc-config: sqlc.yaml
      sqlc-generated-path: internal/alkemio/queries
      # No openapi-make-target: the OpenAPI contract is handwritten
      # (contracts/openapi.yaml, linted by schema-contract.yml), not generated.
