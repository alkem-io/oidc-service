version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - errorlint         # Catches direct error comparisons that fail on wrapped errors
    - govet
    - ineffassign
    - staticcheck      # Includes stylecheck rules for error strings
    - unused
    - bodyclose
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - revive
    - gocritic
    - gosec
    - prealloc
    - whitespace
  settings:
    gocyclo:
      min-complexity: 15
    staticcheck:
      checks:
        - "all"         # Enable all rules including ST1020 (comment format)
    revive:
      enable-all-rules: false
      rules:
        - name: exported
          severity: warning
          arguments:
            - "checkPrivateReceivers"
            - "sayRepetitiveInsteadOfStutters"
            - "checkPublicInterface"    # Check comments on public interface methods
        - name: package-comments
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: defer
        - name: constant-logical-expr
        - name: bool-literal-in-expr
        - name: atomic
        - name: error-strings    # Error strings should not be capitalized or end with punctuation
  exclusions:
    presets: []  # No default exclusions - we want all linter warnings
    rules:
      # G710 flags every http.Redirect with a non-literal target syntactically,
      # validation notwithstanding (it even flags targets already checked
      # against the registered post-logout allow-list). All handler redirects
      # flow through the validated safeRedirect chokepoint in this one file,
      # which rejects non-http(s) schemes and supports host pinning; the rest
      # of the codebase must keep using safeRedirect, where G710 stays active.
      - linters: [gosec]
        path: internal/server/redirect\.go
        text: "G710"
      # G124 guards Secure/HttpOnly/SameSite attributes on Set-Cookie response
      # headers. This service never sets response cookies (no http.SetCookie /
      # Set-Cookie writes anywhere); it only attaches cookies to outgoing
      # requests (e.g. the Kratos whoami call), where those attributes do not
      # exist on the wire. Re-scope to specific paths if response cookies are
      # ever introduced.
      - linters: [gosec]
        text: "G124"

formatters:
  enable:
    - gofmt
    - goimports       # Checks import sorting
  settings:
    goimports:
      local-prefixes:
        - github.com/alkem-io/oidc-service

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
