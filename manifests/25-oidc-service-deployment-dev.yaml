apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc-service
  namespace: default
  labels:
    app: oidc-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oidc-service
  template:
    metadata:
      labels:
        app: oidc-service
    spec:
      imagePullSecrets:
        - name: oidc-service-registry
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Hydra to be ready..."
              until nc -z hydra-admin 4445; do
                echo "Hydra not ready, waiting..."
                sleep 2
              done
              echo "Waiting for Kratos to be ready..."
              until nc -z kratos-admin 80; do
                echo "Kratos not ready, waiting..."
                sleep 2
              done
              echo "All dependencies are ready"
      containers:
        - name: oidc-service
          image: rg.nl-ams.scw.cloud/alkemio/alkemio-oidc-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: POSTGRES_PASSWORD
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: DATABASE_PORT
            - name: DATABASE_NAME
              value: alkemio
            - name: OIDC_KRATOS_BROWSER_URL
              value: $(OIDC_WEB_BASE_URL)/ory/kratos/public
            - name: OIDC_KRATOS_SESSION_COOKIE
              valueFrom:
                configMapKeyRef:
                  name: alkemio-config
                  key: KRATOS_SESSION_COOKIE_NAME
          envFrom:
            - configMapRef:
                name: alkemio-config
            - secretRef:
                name: alkemio-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: hydra
                topologyKey: kubernetes.io/hostname
