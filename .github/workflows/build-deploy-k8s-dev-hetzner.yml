name: Build & Deploy OIDC Service to Dev on Hetzner

on:
  push:
    branches: [develop]

jobs:
  deploy:
    uses: antst/alkemio-github-workflows/.github/workflows/deploy-hetzner.yml@v1
    with:
      environment: dev
      # oidc-service deviates from the org naming conventions: the k8s
      # deployment and container are plain `oidc-service`, not
      # alkemio-oidc-service-deployment / alkemio-oidc-service.
      # (image alkemio-oidc-service and pull secret oidc-service-registry
      # match the defaults.)
      deployment-name: oidc-service
      container-name: oidc-service
      extra-manifests: |
        deployments/kubernetes/configmap.yaml
        deployments/kubernetes/service.yaml
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG_SECRET_HETZNER_DEV }}
      REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
